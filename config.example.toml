# Copy to config.toml and edit. Every key is optional; omitted keys use the
# defaults in pmbot/config.py. Secrets do NOT go here - they go in .env.

dry_run = true          # live needs dry_run = false AND `pmbot run --live` (not built yet)

[fees]                  # docs.polymarket.us/fees
taker_rate = 0.0695     # taker fee = rate * shares * p * (1 - p); live feeCoefficient
maker_fee_rate = 0.0
maker_rebate_rate = 0.0125   # UNVERIFIED: sources say 0.0125 or 25% of taker (0.015)
rounding_increment = 0.01
rounding_mode = "half_even"  # banker's rounding, per fill
cap_cumulative = true        # multi-fill taker orders capped at round(total exact fee)

[markets]
assets = ["BTC"]                 # Polymarket US lists BTC Up/Down only (2026-09-26)
durations = ["15m", "1h"]        # no 5m windows on Polymarket US
search_queries = ["up or down"]
title_keywords = ["up or down", "updown"]
tick_size = 0.01
min_order_size = 1           # UNVERIFIED for Polymarket US
discovery_interval_s = 20.0
lookahead_s = 120.0
post_close_grace_s = 5.0

[monitor]
min_gap = 0.0                # log taker gaps when cost < 1 - min_gap
max_depth_levels = 10
spread_sample_interval_s = 1.0
record_trades = true
book_poll_interval_s = 2.0   # REST fallback when the WebSocket is down
ws_stale_after_s = 30.0
settlement_poll_s = 900.0

[price_feed]                 # reference BTC price (proxy for CF Benchmarks BRTI)
source = "exchanges"         # "exchanges" (Coinbase+Kraken mids), "rtds" (Chainlink relay), "none"
coinbase_url = "wss://ws-feed.exchange.coinbase.com"
kraken_url = "wss://ws.kraken.com/v2"
sample_interval_s = 0.5
source_stale_s = 5.0
ptb_rule = "twap_ending"     # fallback only; the API publishes priceToBeat
history_s = 7200.0

[price_feed.coinbase_products]
BTC = "BTC-USD"

[price_feed.kraken_symbols]
BTC = "BTC/USD"

[price_feed.twap_window_s]   # BRTI: average of 60 prices in the minute before
15m = 60
1h = 60

[api]
gateway_url = "https://gateway.polymarket.us"
api_url = "https://api.polymarket.us"
rest_rate_per_s = 10.0       # documented limit: 20 req/s per key, all endpoints
rest_burst = 10
timeout_s = 10.0
reconnect_initial_s = 1.0
reconnect_max_s = 60.0

[paths]
db_path = "data/pmbot.db"
log_dir = "logs"
log_max_bytes = 20000000
log_backups = 10
kill_file = "KILL"

[strategy]                   # fair-value market making + opportunistic taking
maker_enabled = true
taker_enabled = true
vol_lookback_s = 1800.0
vol_sample_s = 5.0
vol_min_returns = 30
vol_floor_annual = 0.20
vol_cap_annual = 2.50
vol_uncertainty = 0.25
price_uncertainty_bps = 3.0
use_all_ptb_candidates = true
max_feed_age_s = 5.0
quote_size = 10              # shares per side, x trade_scale
min_half_spread = 0.01
model_margin = 0.01
quote_horizon_s = 5.0
spread_vol_mult = 1.0
inventory_skew_per_share = 0.001
quote_price_min = 0.05
quote_price_max = 0.95
quote_start_after_open_s = 5.0
requote_min_interval_s = 0.5
keep_min_edge = 0.005
requote_improve_ticks = 2
taker_min_edge = 0.02        # per share, after the taker fee
taker_max_shares = 20
taker_price_min = 0.02
taker_price_max = 0.98
taker_cooldown_s = 2.0
taker_book_max_age_s = 1.0   # only take against a book updated within 1 s
max_market_gap = 0.10        # |fair - market mid| above this => assume model is wrong; don't trade
vol_refresh_s = 10.0

[strategy.settle_twap_s]     # verified: 60 BRTI prices in the final minute
15m = 60
1h = 60

[strategy.quote_stop_before_close_s]
15m = 60
1h = 90

[risk]                       # enforced outside the strategy
max_window_exposure = 20     # worst-case loss $ per window (incl. resting orders)
max_total_exposure = 60
daily_loss_limit = 20        # halts until next UTC day
daily_take_profit = 0        # 0 = off
daily_loss_hard_cap = true   # open worst-case risk <= what's left of daily_loss_limit
window_take_profit = 5       # lock the window (stop trading it)
window_stop_loss = 10
entry_cutoff_s = 30          # no orders in the final 30 s; cancel all
max_orders_per_min = 60
max_cancels_per_min = 60
max_actions_per_s = 4.0

[sizing]
base_window_budget = 20
trade_scale = 1.0            # scales quote size, taker size and window budget
paper_balance = 100

[sim]
latency_ms = 150.0
markout_s = [10.0, 60.0]
